# Everyday wording -> legal issue (query processor, before retrieval).
# A concept fires when the question matches at least one pattern in EVERY group of `when`.
# Its `legal` text is added to the search query (keyword + meaning search + reranker), and `topic` routes the module.
# Add a concept when the improvement inbox shows everyday questions falling back.
concepts:
  - name: faulty goods bought from a business
    when:
      - [bought, buy, purchased, ordered, shop, store, retailer, seller, online, amazon, argos, paid]
      - [faulty, defective, broken, broke, stopped working, stops working, not working, doesn't work, does not work,
         "keeps (?:shutting|turning|switching) (?:down|off)", "shut(?:s|ting)? down", crash, crashes, crashing, fault, damaged, cracked,
         repair, repaired, refund, replace, replacement, return, money back, reject]
    legal: >-
      consumer goods not of satisfactory quality or fit for purpose; Consumer Rights Act 2015 ss 9, 10, 19, 20, 22, 23, 24;
      short-term right to reject within 30 days; right to repair or replacement; price reduction or final right to reject;
      goods presumed faulty at delivery if fault appears within six months (s 19(14))
    topic: commercial-law
  - name: late or missing delivery
    when:
      - [bought, ordered, purchased, paid]
      - [not arrived, never arrived, hasn't arrived, late, delivery, delivered, not delivered, lost in the post]
    legal: >-
      delivery of goods and passing of risk to the consumer; Consumer Rights Act 2015 s 28 delivery of goods, s 29 passing of risk
    topic: commercial-law
  - name: faulty digital content
    when:
      - [app, game, software, download, downloaded, streaming, subscription, ebook, digital]
      - [faulty, not working, doesn't work, crash, crashes, bug, refund, repair, broken]
    legal: >-
      digital content not of satisfactory quality; Consumer Rights Act 2015 ss 34-36, 42-44 repair or replacement,
      price reduction, refund
    topic: commercial-law
  - name: poor service by a trader
    when:
      - [builder, plumber, mechanic, garage, hairdresser, service, workman, contractor, repaired my, fixed my]
      - [bad job, poor, badly, not done, unfinished, damaged, overcharged, refund, redo]
    legal: >-
      service not performed with reasonable care and skill; Consumer Rights Act 2015 ss 49-52, 54-56 repeat performance
      and price reduction
    topic: commercial-law

  # ---- problem-question / essay facts -> the doctrine they raise (issue spotting) ----
  - name: priority in registered land (mortgagee v occupier)
    when:
      - [registered, title, land registry, house, flat, property]
      - [mortgage, mortgaged, charge, bank, lender, sold to, purchaser, buyer]
      - [contributed, lives there, living there, occupation, occupies, moved in, partner, mother, father, son, daughter, wife, husband, equitable interest, beneficial]
    legal: >-
      registered land priority: Land Registration Act 2002 s 27 registrable dispositions, s 29 priority, Schedule 3 para 2
      overriding interests of persons in actual occupation and its exceptions (inquiry; obvious on inspection);
      overreaching under Law of Property Act 1925 ss 2 and 27 (two trustees); implied trust from contribution to the price
    topic: land-law
  - name: easement over registered land not registered
    when:
      - [right of way, easement, access, path, drive, parking]
      - [deed, granted, express, not registered, never registered, unregistered]
    legal: >-
      express legal easement is a registrable disposition under Land Registration Act 2002 s 27(2)(d); unregistered it is
      equitable only; equitable easements cannot override under Schedule 3 para 3; protection by notice
    topic: land-law
  - name: bodily autonomy and consent to treatment
    when:
      - ["one's body", own body, bodily, autonomy, self-determination, refuse treatment, refusal of treatment, medical treatment, patient]
    legal: >-
      consent to and refusal of medical treatment; capacity under Mental Capacity Act 2005 ss 1-3; best interests s 4;
      advance decisions ss 24-26; competent adult's right to refuse life-sustaining treatment (Re T, Re B, Re MB);
      children's consent and refusal (Gillick, Re W, Family Law Reform Act 1969 s 8); limits: assisted suicide, consent to harm
    topic: law-and-medicine
  - name: limitation (is the claim time-barred?)
    when:
      - [time-barred, time barred, too late to sue, limitation, years ago, out of time, still sue, deadline to sue]
    legal: >-
      limitation periods: Limitation Act 1980 s 2 tort (six years), s 5 contract (six years), s 21 trust property and
      breach of trust (six years; no period for fraud or recovering trust property from the trustee), s 32 postponement
      for fraud, concealment or mistake
    topic: civil-procedure
